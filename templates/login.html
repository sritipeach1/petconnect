{% extends "base.html" %}
{% block title %}Login | PetConnect{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container auth-container">
        <div class="auth-left">
            <span class="eyebrow">Welcome back</span>
            <h1>Login to PetConnect</h1>
            <p>
                Access your dashboard to manage appointments, pets, and clinic activities.
            </p>
            <img src="{{ url_for('static', filename='images/auth-login.jpg') }}" alt="Login image">
        </div>

        <div class="auth-card">
            <h2>Sign In</h2>

            <form method="POST" class="auth-form">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>

                <button type="submit" class="btn btn-primary full-btn">Login</button>
            </form>

            <p class="auth-switch">
                Don’t have an account?
                <a href="{{ url_for('register') }}">Create one</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
